name: build

# GitHub will not start a job until the account has billing set up, so this runs
# only on demand. Add `push:` / `pull_request:` back under `on:` once billing is
# in place and every push gets checked automatically.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Soundstage.slnx -c Release --nologo
